<template>
    <template if:true={isModalVisible}>
        <section class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Alert</h2>
                </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>The Account Rating is "Hot". Take necessary action! </p>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>The Account Rating is "Hot". Take necessary action! No</p>
                    </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Option 1" variant="brand" onclick={handleYes}></lightning-button>
                    <lightning-button label="Option 2" variant="neutral" onclick={handleNo}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
