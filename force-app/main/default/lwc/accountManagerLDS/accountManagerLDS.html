<template>
    <lightning-card title="Account Manager">
        <lightning-layout>
            <lightning-layout-item size="6" padding="around-small">
                <lightning-card title="Create a New Account">
                    <lightning-input name="Account Name" label="Name" onchange={accountNameHandler} padding="around-small"></lightning-input>
                    <lightning-input name="Account Phone" type="Phone" label="Phone:" onchange={accountPhoneHandler} padding="around-small"></lightning-input>
                    <lightning-input name="Account website" type="website" label="Website" onchange={accountWebHandler} padding="around-small"></lightning-input>
                    <lightning-button label="Create Account" onclick={createAccount} variant="brand"></lightning-button>
                </lightning-card>
            </lightning-layout-item>
            <lightning-layout-item size="6" padding="around-small">
                <lightning-card title="View Account Record">
                    <p><lightning-formatted-text value={retAccountName}></lightning-formatted-text></p>
                    <p><lightning-formatted-phone value={retAccountPhone}></lightning-formatted-phone></p>
                    <p><lightning-formatted-url value={retAccountWebsite}></lightning-formatted-url></p>
                </lightning-card>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
</template>
