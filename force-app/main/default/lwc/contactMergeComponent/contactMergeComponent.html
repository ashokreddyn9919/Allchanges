<template>
    <lightning-card title="Contacts Owned by You">
        <lightning-button label="Merge" onclick={handleMerge} class="slds-m-bottom_small"></lightning-button>

        <div style="height: 300px; overflow-y: auto;">
            <lightning-datatable
                key-field="Id"
                data={contacts}
                columns={columns}
                onrowselection={handleRowSelection}
                default-sort-direction={defaultSortDirection}
                sorted-direction={sortDirection}
                sorted-by={sortedBy}
                onsort={onHandleSort}
            ></lightning-datatable>
        </div>

        <template if:true={showError}>
            <lightning-toast title="Error" message={errorMessage} variant="error"></lightning-toast>
        </template>

        <template if:true={showModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Merge Contacts</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p>Select the data you want to keep before merging:</p>
                        <lightning-input type="radio" name="email" label={contact1.Email} checked></lightning-input>
                        <lightning-input type="radio" name="email" label={contact2.Email}></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Merge" onclick={performMerge}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
