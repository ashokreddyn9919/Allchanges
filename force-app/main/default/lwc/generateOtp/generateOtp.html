<template>
<div if:true={Verification}>
<lightning-card title={title} icon-name={iconName}>
<lightning-button variant="brand" label="Send OTP" title="Send OTP" onclick={generateOTP} class="slds-var-m-left_x-small" disabled={disabled}></lightning-button>
    <div class="slds-var-m-around_medium" if:false={loading}>
    <div if:true={disabled}>
        <p class="slds-text-heading_medium">
        <!-- <span class="slds-m-bottom_x-small">{code}</span> -->
        <lightning-progress-ring
            value={ringCounter}
            variant={ringVariant}
            class="slds-var-m-left_small"
        ></lightning-progress-ring>
        </p>
        <p>Refreshing in {refreshCounter} second(s)</p>
    </div>
    <div if:false={disabled}>
        <p>Click to generate OTP </p>
    </div>
    </div>
</lightning-card>
</div>

<template lwc:if={Success}> 
    <lightning-card title="Email verified successfully.">
        <lightning-icon icon-name="action:approval" alternative-text="success" title="success" class="slds-p-left_small"></lightning-icon>
    </lightning-card>
</template>

<template lwc:else> 
    <lightning-card title="Verify">
        <lightning-input type="text" label="Enter OTP" class="verify slds-p-left_small"></lightning-input>
        <lightning-button variant="brand" label="Verify OTPs" title="Verify OTPs" onclick={verifyOTP} class="slds-p-left_small slds-p-top_x-small"></lightning-button>
    </lightning-card>
</template>
   
</template>
