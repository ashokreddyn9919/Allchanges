<template>
    <template if:true={showModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                
                <header class="slds-modal__header">
                    <h2 id="modal-heading" class="slds-text-heading_medium">
                        Select Account Type
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-radio-group
                        name="sourceType"
                        label="Choose Source"
                        options={sourceOptions}
                        value={selectedSource}
                        onchange={handleSourceChange}>
                    </lightning-radio-group>

                    <template if:true={filteredRecordTypes.length}>
                        <div class="slds-m-top_medium">
                            <template for:each={filteredRecordTypes} for:item="rt">
                                <div key={rt.value}
                                     class="slds-box slds-m-bottom_small recordtype-box"
                                     data-value={rt.value}
                                     onclick={handleRecordTypeClick}>
                                    <div class="slds-text-heading_small">{rt.label}</div>
                                    <div class="slds-text-body_small slds-text-color_weak">
                                        {rt.description}
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
